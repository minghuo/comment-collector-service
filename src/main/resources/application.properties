spring.profiles.active = pro
spring.mandatory-file-encoding = UTF-8
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# POST size limit
server.tomcat.max-http-form-post-size=20MB
server.tomcat.uri-encoding = UTF-8
server.tomcat.accept-count = 512
server.port = 8075
server.servlet.context-path = /comment-collector
# 优雅停机：先停止接收新请求，等待在途请求处理完（最多 timeout-per-shutdown-phase）再关闭容器
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# 虚拟线程（JDK21）：Tomcat 请求线程改用虚拟线程，同步阻塞 IO 场景下吞吐更高。
# 采集消费者线程池是显式创建的平台线程，不受此开关影响
spring.threads.virtual.enabled=true
#
springdoc.packages-to-scan=com.sysj.collector.controller
springdoc.paths-to-match=/**
server.servlet.session.timeout=18000

# log
#logging.config=classpath:log4j2.xml

# MongoDB
spring.data.mongodb.field-naming-strategy=org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy
# 索引的唯一真相源是 db/init-comment-collector.js（部署时用 mongosh 执行）。
# 这里显式关闭自动建索引：实体上的 @Indexed/@CompoundIndex 只作为"设计意图"的文档说明，
# 不靠启动时隐式创建（那会在生产启动时触发后台建索引，且无法删除已冲突的旧索引）。
spring.data.mongodb.auto-index-creation=false

# Redis
spring.data.redis.database = 5
spring.data.redis.jedis.pool.max-active = 20
spring.data.redis.jedis.pool.max-wait = -1
spring.data.redis.jedis.pool.max-idle = 10
spring.data.redis.jedis.pool.min-idle = 0
spring.data.redis.timeout = 30000
# 说明（2026-10-11）：这里曾有两行 spring.cache.redis.* 配置，属**死配置** ——
# 本项目的 CacheManager 是 Caffeine 本地缓存（见 AppConfig#cacheManager，TTL 60s），
# 根本没有 RedisCacheManager 去读它们，留着只会让运维误以为"改配置要等 30 分钟"。
# 已删除 spring.cache.redis.time-to-live / cache-null-values；改 DB 后要立即生效，
# 调 POST /api/admin/cache/evict（见 AdminCacheController）。

# Collector Config
# 过载保护：异步队列容量上限。队列满时新的 ASYNC 提交立即返回 503，
# 不再像以前那样无界堆积（此前 queue-capacity 是死配置，队列实际无上限）。
collector.task.queue-capacity=10000
# 消费者线程数；<=0 表示按 CPU 自动（availableProcessors × 2）。
# 说明：不采用 core/max 双值——消费者是"取到任务就一直循环"的长驻线程，
# 池的弹性伸缩对它没有意义；需要隔离不同用途的池属于 P2-8（Bulkhead）。
collector.task.consumer-threads=0

# 防饥饿 —— Aging（等待越久有效优先级越高，数值越小越优先）
#   有效优先级 = max(0, userPriority - (等待秒数 / aging-interval-seconds) * aging-priority-boost)
collector.task.aging-interval-seconds=60
collector.task.aging-priority-boost=10
# 等待超过该时长直接提到最高优先级（deadline 保障）
collector.task.max-wait-minutes=30

# 防饥饿 —— 公平配额（高优先级占比过高时，每轮预留一部分名额给低优先级任务）
collector.task.fair-quota-ratio=0.3
collector.task.fair-quota-threshold=0.7
# 有效优先级小于该值算"高优先级"（对应 NORMAL 等级 100、VIP 10、ENTERPRISE 1）
collector.task.fair-quota-high-priority-bound=500
# 一个消费轮次的名额数：每轮预留 ceil(batch-size * ratio) 个名额
collector.task.fair-quota-batch-size=20

# 熔断器（阶段2：状态机/滑动窗口/半开名额在 Redis，多实例共享同一份健康真相；
# Mongo supplier_state.circuit_state 退化为观测副本 + Redis 丢失后的播种恢复源）
#   CLOSED --(失败率/慢调用率超阈值)--> OPEN --(冷却结束)--> HALF_OPEN --(探测全成功)--> CLOSED
collector.circuit.enabled=true
# Redis key 前缀（结构常量：state:{key} / window:{key} / seq:{key} / warmup:{key}）
collector.circuit.redis-key-prefix=collector:circuit
collector.circuit.failure-rate-threshold=50
# 慢调用判定（毫秒）；<=0 关闭慢调用统计
collector.circuit.slow-call-ms=10000
collector.circuit.slow-call-rate-threshold=80
# 滑动窗口请求数（只统计最近 N 次调用）
collector.circuit.sliding-window-size=20
# 触发统计的最小请求数（未达此数不熔断，避免冷启动误判）
collector.circuit.minimum-calls=5
# 熔断时长（秒），冷却结束后进入半开
collector.circuit.open-seconds=60
# 半开放行的探测请求数，全部成功才回到 CLOSED
collector.circuit.half-open-calls=3
# 纯计数写库节流（状态迁移一律立即落库）
collector.circuit.persist-interval-seconds=30
# 驱逐比例上限（借鉴 Envoy outlier_detection.max_ejection_percent）：再驱逐一个就会超过该比例时
# **不驱逐**，把候选留在池子里，防止"把整个池子驱逐干净"自伤。100 = 不限制（缺省）。
collector.circuit.max-ejection-percent=100
# panic 阈值（借鉴 Envoy outlier_detection.panic_threshold）：可用候选占比低于该百分比时，
# 忽略熔断隔离放行一个"最不坏"候选（一次性许可，由熔断闸门消费）。0 = 关闭（缺省）。
# 注意：Envoy 缺省 50%，但本项目候选常只有 1~5 个，50% 会让 3 候选场景下驱逐 2 个就 panic —
# 等于把熔断关掉；故缺省关闭，候选 ≥4 个的平台可设为 50。
collector.circuit.panic-threshold-percent=0
# panic 许可存活窗口（毫秒，结构常量，不可被 system_config 覆盖）：路由判定到真正发起调用
# 之间的最大间隔，超过即作废，避免路由与执行错配后放行一个早已不该放的候选。
collector.circuit.panic-allowance-ttl-ms=5000
# Redis 熔断 key（state/window/seq/warmup）的 TTL（秒）。这些 key 原先无过期时间，
# 供应商下线/改名/改前缀后会永久驻留；同时给"意外残留"一个自然淘汰路径。
# null/<=0 视为 1 秒下限（由代码 Math.max(1, ...) 保证），不要配成 0 去"关闭 TTL"。
collector.circuit.key-ttl-seconds=86400

# 自适应限速 + 流控效果（§8.2/§8.3，借鉴 B-11/B-14）
# 有效速率 = min(rate_per_second, 1000 / adaptive_delay_ms)，失败时延迟只增不减。
# 阶段2：令牌桶/自适应延迟/预热起点均在 Redis（多实例共享同一份速率配额），key 前缀如下
collector.ratelimit.adaptive-enabled=true
# Redis key 前缀（结构常量：delay:{key} / warmup:{key} / bucket:{key}）
collector.ratelimit.redis-key-prefix=collector:ratelimit
# REJECT / WARM_UP 取令牌的最长等待；超时即跳过该供应商
collector.ratelimit.reject-timeout-ms=500
# THROTTLE_QUEUE 的默认最长排队等待（供应商配置 max_queue_wait_ms 可覆盖）
collector.ratelimit.max-queue-wait-ms=2000
# 冷启动 / 熔断恢复后的预热时长；WARM_UP 效果下速率从 0 平滑升到有效速率
collector.ratelimit.warm-up-seconds=30
# effective_qps / adaptive_delay_ms 写回 supplier_state 的节流间隔
collector.ratelimit.persist-interval-seconds=30
# Redis 自适应限速 key（delay:/warmup:/bucket:）的 TTL（秒）。原先无过期时间，
# 供应商下线后 delay key 会永久驻留并把旧速率带进新实例；TTL 到期即回到配置速率。
collector.ratelimit.key-ttl-seconds=86400

# 断点续采：启动时扫描未完成任务并重新入队。
# 遇到问题版本时可先置 enabled=false 阻止"每次重启都重灌一批任务"放大故障。
collector.recovery.enabled=true
collector.recovery.scan-on-startup=true
# "陈旧 RUNNING"判据（毫秒）：恢复扫描遇到 DB 里仍是 RUNNING 的子任务时，
# 只有 update_time < now - 该值 才视为上个实例留下的墓碑并被接管（见 SubTaskDao#markRunningIfStale）。
# 必须远大于单次采集的最大耗时，否则会把自己正在跑的实例重复投递。
collector.recovery.stale-running-ms=600000

# 子任务级重试（阶段1 重试闭环）：单次执行（含供应商内重试与供应商切换）整体失败后，
# 子任务不立即判死，按指数退避延迟重投。
#   有效优先级：管线 RetryStage 管"供应商内重试"，门面候选循环管"供应商间切换"，
#   本机制管"全部候选耗尽后的跨队列重投"——三层语义各管一段。
# 与 STATUS_URL_ERROR 等确定性失败的区分见 SubTaskRetryPolicy。
collector.task.sub-retry-enabled=true
# 单个子任务最多重投次数（写入 sub_task.max_retry 的默认值）
collector.task.sub-retry-max=2
# 第 n 次重投延迟 = base × 2^(n-1)，封顶 max-delay
collector.task.sub-retry-base-delay-ms=2000
collector.task.sub-retry-max-delay-ms=600000
# 重投扫描周期（RETRYING 且 next_execute_time 到期的子任务）；启动后延迟首个扫描，避开恢复扫描高峰
collector.task.sub-retry-scan-ms=15000
collector.task.sub-retry-initial-delay-ms=20000
# 重投提交时队列已满：不判死，推迟 queue-reschedule-ms 后由下一次扫描再试
collector.task.sub-retry-queue-reschedule-ms=30000

# 主任务完成回调：主任务进入终态（COMPLETED/FAILED）后向 callbackUrl POST 结果摘要。
# 失败按固定次数退避重试；secret 非空时附加 X-Collector-Signature（HMAC-SHA256(body)）供调用方验签
# （enabled/timeout-ms/max-attempts 可被 system_config 覆盖；secret 属敏感项只留在这里）
collector.callback.enabled=true
collector.callback.timeout-ms=5000
collector.callback.max-attempts=3
# 为空则不带签名头
collector.callback.secret=

# 服务端自动翻页（阶段1）：子任务采到 hasMore=true 时自动生成带游标的续采子任务。
# 游标回传契约见 PlatformCursorKeys（微博 maxId / B站小红书 cursor / 微信 buffer / 抖音头条 page+1）。
# enabled/max-pages 可被 system_config 覆盖；任务级 autoPage 参数优先于全局默认
collector.task.auto-paging.enabled=false
collector.task.auto-paging.max-pages=10

# API 鉴权（阶段1）：默认关闭，保持存量调用方行为。
# enabled=true 后，除 /api/health 外的 /api/** 均需携带请求头（默认 X-API-Key）。
# key 属安全敏感项，只留在这里（生产建议用环境变量注入），不进 system_config
collector.auth.enabled=false
collector.auth.api-keys=
collector.auth.header-name=X-API-Key
# 密钥 → 调用方身份映射（key:owner 逗号分隔），供任务查询接口的归属校验使用。
# 未配置时无法识别调用方身份 ⇒ 开启 task-isolation-enabled 后任务读取会被拒绝（fail closed）
collector.auth.api-key-owners=
# 配置写接口（PUT/DELETE /api/config/{key}、POST /api/config/sync-registry）的管理员密钥。
# **独立于 collector.auth.enabled**：总开关关闭（内部直连）时也能单独启用写保护
collector.auth.admin-keys=
# 任务归属校验（修 R5）：开启后 GET /api/tasks/{taskId} 与 /api/tasks/{taskId}/comments
# 只允许任务归属方读取，校验失败返回 404（不暴露任务是否存在）。缺省关闭 = 不动存量调用方行为
collector.auth.task-isolation-enabled=false
# 配置写保护（修 R5）：开启后配置写接口必须携带管理员密钥。
# 注意先配好 collector.auth.admin-keys，否则写操作一律 403（fail closed）
collector.config.protect-writes=false
# 500 响应是否回显异常 message（修 R5）：缺省 false，只回 traceId + 服务端日志；
# 仅在排障不便时临时置 true（异常原文可能含驱动/集合/内部类名等实现细节）
collector.api.expose-error-detail=false

# ── Redis Stream 外置队列（阶段2）─────────────────────────────────────────
# 异步任务写入 Redis Stream，进程重启后未完成任务仍在流里，由消费者组继续消费。
# 优先级用 HIGH/LOW 两条流近似（用户等级），跨流顺序由消费者按公平配额选择；
# LOW 中等待超过 max-wait-minutes 的任务由维护任务迁移到 HIGH（deadline 保障）。
# 投递语义为至少一次：处理完成才 XACK+XDEL，崩溃遗留消息由 XCLAIM 接管重投，
# 因此子任务终态写入与主任务计数是幂等的（条件更新）。
# 流名/组名/消费者名属结构常量；容量 collector.task.queue-capacity 可被 system_config 覆盖
collector.queue.stream-high=collector:tasks:high
collector.queue.stream-low=collector:tasks:low
collector.queue.group=collector-consumers
# 消费者名：默认取主机名（多实例各不相同，组内竞争消费）
collector.queue.consumer-name=
# 读新消息的阻塞时长（毫秒）
collector.queue.block-ms=5000
# pending 清扫：每 N 次循环清一次本消费者名下未确认消息（接管重启遗留）
collector.queue.pending-drain-every=25
# XCLAIM 接管扫描间隔与最小空闲时长；空闲阈值必须大于单任务最大执行时长
# （调用链预算 ≈ timeout×(max_retry+1)+退避，当前默认 <2min，10min 足够安全）
collector.queue.claim-sweep-ms=60000
collector.queue.claim-min-idle-ms=600000
# deadline 迁移扫描间隔（毫秒）；等待阈值复用 collector.task.max-wait-minutes
collector.queue.promotion-scan-ms=60000

# ── Redis 降级兜底（阶段2.5）──────────────────────────────────────────────
# Redis 故障时服务不停摆：任务落本地兜底队列（消费者本实例直接消化），
# 熔断/限流按放行兜底；探活恢复后自动重建消费组并把兜底队列回流到流。
# 兜底队列是内存态：降级期间进程崩溃会丢消息，但子任务在 Mongo 是 RUNNING，
# 启动恢复扫描会重新提交——不产生永久丢失。
# Redis 探活间隔（毫秒）；也是消费组重建的重试间隔
collector.queue.redis-probe-ms=10000
# 本地兜底队列回流扫描间隔（毫秒）
collector.queue.fallback-drain-ms=5000
# 兜底队列容量与 Redis 流共用 collector.task.queue-capacity

# 供应商注册表同步（阶段：多平台补充）：按 platform_feature_config 自动补齐
# supplier_state 条目与 user_tier_config 各等级的功能项（幂等，在线状态不受影响）。
# 新增平台/供应商后最迟一个巡检周期生效，或调 POST /api/config/sync-registry 立即同步
collector.sync.registry-ms=300000

# 供应商调用管线（§8.1/§9.2，借鉴 B-12/B-19/B-20/B-03）
#   装配顺序：Bulkhead → CircuitBreaker → RateLimit → Retry → Timeout → provider.fetchComments
# 总开关：置 false 表示所有阶段直连供应商（压测时逐项隔离用）
collector.pipeline.enabled=true
# 单次调用超时（毫秒）；供应商配置 providers[].timeout_ms 优先。
# 注意：它限的是"一次 fetchComments"，整链预算是 timeout_ms×(max_retry+1)+退避总和（§9.5）。
# 取值不应超过 http-client-utils 的 OkHttp callTimeout（默认 60s），否则底层网络请求会活得比这里更久。
collector.pipeline.timeout-ms=15000
# 默认并发上限（Bulkhead）；供应商配置 providers[].max_concurrency 优先，0 = 不限
collector.pipeline.default-max-concurrency=4
# Bulkhead 排队等待上限（毫秒）：flow_effect=THROTTLE_QUEUE 的供应商取不到并发许可时最多等这么久，
# 时长取 providers[].max_queue_wait_ms，并始终被本值封顶；<=0 = 一律不排队（立即失败）。
# 排队占的是消费者线程，所以上限不宜大：默认 5000 已覆盖"百毫秒级上游 + 数倍于上限的并发链接"这种排队。
collector.pipeline.bulkhead-max-queue-wait-ms=5000
# 限时工作线程数上限；<=0 = 按 CPU 自动（availableProcessors × 8，下限 64）。
# 池满时调用被立即拒绝（不排队）——排队会让"限时"承诺失效
collector.pipeline.timeout-threads=0
# 池上限热更新的巡检周期（毫秒）：TimeoutStage 周期检查 system_config 里
# collector.pipeline.timeout-threads 的最新值并按需 setMaximumPoolSize（2026-10-11 新增）
collector.pipeline.timeout-threads-refresh-ms=30000
# 重试退避基数（毫秒）：第 n 次重试等待 base × 2^(n-1)
collector.pipeline.retry-backoff-base-ms=500
# 分阶段开关（压测逐项隔离）
collector.pipeline.bulkhead-enabled=true
collector.pipeline.timeout-enabled=true

# ── 星光（XG）渠道：海外三平台（Twitter/Facebook/YouTube）评论 ──
# token 走 query 参数（https://dataapi.supinfor.com/v3/getComments{Twitter|Facebook|Youtube}）。
# 未配置时星光供应商直接返回参数错误，不发起外部请求
collector.provider.xg.api-token=${XG_API_TOKEN:}
