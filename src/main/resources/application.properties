spring.profiles.active = dev
spring.mandatory-file-encoding = UTF-8
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# POST size limit
server.tomcat.max-http-form-post-size=20MB
server.tomcat.uri-encoding = UTF-8
server.tomcat.accept-count = 512
server.port = 8075
server.servlet.context-path = /comment-collector-service
springdoc.packages-to-scan=com.sysj.auto.task.web.controller
springdoc.paths-to-match=/**
server.servlet.session.timeout=18000

# log
#logging.config=classpath:log4j2.xml

# MongoDB
spring.data.mongodb.field-naming-strategy=org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy

# Redis
spring.data.redis.database = 5
spring.data.redis.jedis.pool.max-active = 20
spring.data.redis.jedis.pool.max-wait = -1
spring.data.redis.jedis.pool.max-idle = 10
spring.data.redis.jedis.pool.min-idle = 0
spring.data.redis.timeout = 30000
spring.cache.redis.time-to-live = 30m
spring.cache.redis.cache-null-values = false

# Collector Config
collector.task.queue-capacity=10000
collector.task.core-pool-size=4
collector.task.max-pool-size=8
collector.task.aging-interval-seconds=60
collector.task.aging-priority-boost=10
collector.task.max-wait-minutes=30
collector.task.fair-quota-ratio=0.3
collector.task.fair-quota-threshold=0.7
collector.recovery.enabled=true
collector.recovery.scan-on-startup=true
