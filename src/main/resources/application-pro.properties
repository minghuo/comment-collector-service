# Mongodb
# 注意：key 必须是 spring.data.mongodb.uri（此前误写为 spring.data.mongodb.uri.uri，
# 导致 pro profile 下 MongoDB 连接串完全不生效，会退化成 spring.data.mongodb.uri 的默认值）
spring.data.mongodb.uri = mongodb://comment-collector-service:rK!7fP!$uE3i@192.168.0.4:27017/comment_task?authSource=admin&authMechanism=SCRAM-SHA-1

# Redis
# 说明：当前代码未实际使用 Redis（配置热缓存走 Caffeine 本地缓存，见 AppConfig#cacheManager），
# 因此 Redis 不可用不影响启动与采集。保留配置是为了后续集群化限流/队列使用。
spring.data.redis.url = redis://192.168.0.4:6379

# file path dir
file.upload.dir.permission=700
file.upload.dir.path = /data/sources/auto/

# interact api
interact.apiUrl = http://192.168.0.2:8038/metrics/task/

sy.api.token = ${SY_API_TOKEN:Bearer SYC123XYZ456DEF789}
sy.base.url = ${SY_BASE_URL:http://192.168.0.2:9006/api_hub/}

# Swagger UI / OpenAPI（修 R5：此前两行被注释掉，生产 profile 反而**开启了**接口文档暴露）
# 生产环境不需要在线接口文档：文档会把全部接口、参数与数据模型列出来，且不受 API 鉴权保护。
# 需要在线调试时用 -Dspringdoc.api-docs.enabled=true 临时覆盖。
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
# 同时把 paths-to-match 收窄回业务接口，避免把 actuator 等非业务端点也编进文档
springdoc.paths-to-match=/api/**
